name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with_cfg
            directory: .
          - name: examples
            directory: examples
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: tamird/sty@f9027c84126ec3ed1d498b36fe6e407a50e87506
        with:
          audit-loads: true
          working-directory: ${{ matrix.directory }}
          artifact-name: sty-${{ matrix.name }}
