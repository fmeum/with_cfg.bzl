name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: tamird/sty@7a7735d89d1278d39feae4759c919fb604fcff34
        with:
          audit-loads: true
          files: |
            with_cfg/private/args.bzl
            with_cfg/private/frontend.bzl
            with_cfg/private/original_settings_rule.bzl
            with_cfg/private/providers.bzl
            with_cfg/private/rewrite.bzl
            with_cfg/private/select.bzl
            with_cfg/private/setting.bzl
            with_cfg/private/transitioning_alias.bzl
            with_cfg/private/utils.bzl
            examples/dynamic_deps/rules/runfiles_dir.bzl
